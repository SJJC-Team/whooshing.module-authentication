jobs:
  build-and-upload:
    name: Build and Upload All Binaries
    runs-on: ${{ matrix.os }}
    container: swift:${{ matrix.swift_version }}

    strategy:
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04, ubuntu-24.04, macos-14, macos-15]
        swift_version: [6.0, 6.1]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Swift
        uses: fwal/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift_version }}

      - name: Cache Swift dependencies
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.swiftpm
            service/.build
          key: ${{ runner.os }}-${{ matrix.os }}-${{ matrix.swift_version }}-service-${{ hashFiles('service/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-${{ matrix.swift_version }}-service-

      - name: Build and package App
        working-directory: ./service
        run: |
          bash ./release.sh ${{ matrix.swift_version }}

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.CLWANG_RELEASE_ACCESS }}
        with:
          files: |
            release/*.tar.gz
